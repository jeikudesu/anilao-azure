<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP | ANILAO AZURE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#38bdf8', 'brand-dark': '#0284c7', 'brand-light': '#bae6fd',
                        'slate-bg': '#08101a', 'slate-card': '#0d1b2a', 'heading': '#f0f9ff',
                        'body': '#94a3b8'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-bg text-slate-100 pt-24">

    <!-- Nav -->
    <nav class="fixed w-full z-50 top-0 start-0 bg-slate-bg/90 backdrop-blur-xl border-b border-white/10 no-print">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-5">
          <a href="index.html" class="flex items-center space-x-3">
              <span class="w-3 h-3 rounded-full bg-brand"></span>
              <span class="self-center text-xl font-extrabold tracking-widest uppercase text-heading">ANILAO <span class="font-serif-italic font-normal text-brand lowercase">azure</span></span>
          </a>
          <div class="flex md:order-2 space-x-3">
              <button id="cart-btn" class="bg-brand hover:bg-brand-dark text-slate-bg font-extrabold text-xs uppercase tracking-wider rounded-full px-6 py-2.5 shadow-lg">Cart (<span id="cart-count">0</span>)</button>
          </div>
          <div class="hidden w-full md:block md:w-auto md:order-1">
            <ul class="font-medium text-xs tracking-widest uppercase flex flex-col p-4 md:p-0 mt-4 md:flex-row md:space-x-8 md:mt-0">
              <li><a href="index.html#home" class="block py-2 text-body hover:text-white">01 / Home</a></li>
              <li><a href="index.html#about" class="block py-2 text-body hover:text-white">02 / About</a></li>
              <li><a href="shop.html" class="block py-2 text-brand font-bold">05 / Shop</a></li>
            </ul>
          </div>
        </div>
    </nav>

    <!-- Shop Grid -->
    <section class="max-w-screen-xl mx-auto p-4 my-8 no-print">
        <div class="flex justify-between items-end mb-6 border-b border-white/10 pb-4">
            <div>
                <span class="text-xs font-mono text-brand uppercase tracking-widest">EQUIPMENT</span>
                <h2 class="text-3xl font-extrabold text-heading">Diving Products</h2>
            </div>
            <span class="text-xs text-body font-mono">6 ITEMS</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-16" id="diving-products"></div>

        <div class="flex justify-between items-end mb-6 border-b border-white/10 pb-4">
            <div>
                <span class="text-xs font-mono text-brand uppercase tracking-widest">DELICACIES & CRAFTS</span>
                <h2 class="text-3xl font-extrabold text-heading">Local Batangas Goods</h2>
            </div>
            <span class="text-xs text-body font-mono">6 ITEMS</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6" id="local-goods"></div>
    </section>

    <!-- Cart Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-[100] flex justify-center items-center no-print">
        <div class="discover-card p-6 rounded-2xl w-11/12 max-w-md relative shadow-2xl">
            <button id="close-cart" class="absolute top-4 right-4 text-2xl text-body hover:text-white">&times;</button>
            <h2 class="text-2xl text-heading font-extrabold mb-4">Your Shopping Cart</h2>
            <div id="cart-items" class="max-h-64 overflow-y-auto mb-4 border-b border-white/10 pb-4"></div>
            <div class="text-xl font-bold text-heading text-right mb-6">Total: ₱<span id="total-price">0</span></div>
            <button id="checkout-btn" class="w-full bg-brand hover:bg-brand-dark text-slate-bg font-extrabold text-xs uppercase tracking-wider rounded-full py-3 shadow-lg">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Sign-Up Modal -->
    <div id="signup-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-lg z-[200] flex justify-center items-center no-print">
        <div class="discover-card p-8 rounded-2xl w-11/12 max-w-lg relative shadow-2xl">
            <button id="close-signup" class="absolute top-4 right-4 text-2xl text-body hover:text-white">&times;</button>
            <span class="text-xs font-mono text-brand uppercase tracking-widest block mb-1 text-center">ACCOUNT REQUIRED</span>
            <h2 class="text-2xl text-heading font-extrabold mb-6 text-center">Sign Up to Order</h2>

            <form id="signup-form" class="max-w-md mx-auto space-y-4">
                <div>
                    <label class="block text-[10px] font-mono uppercase tracking-widest text-body mb-1">Email Address</label>
                    <input type="email" id="floating_email" class="w-full bg-slate-bg border border-white/20 rounded-lg p-2.5 text-heading text-sm focus:outline-none focus:border-brand" required placeholder="diver@anilao.ph" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-mono uppercase tracking-widest text-body mb-1">First Name</label>
                        <input type="text" id="floating_first_name" class="w-full bg-slate-bg border border-white/20 rounded-lg p-2.5 text-heading text-sm focus:outline-none focus:border-brand" required />
                    </div>
                    <div>
                        <label class="block text-[10px] font-mono uppercase tracking-widest text-body mb-1">Last Name</label>
                        <input type="text" id="floating_last_name" class="w-full bg-slate-bg border border-white/20 rounded-lg p-2.5 text-heading text-sm focus:outline-none focus:border-brand" required />
                    </div>
                </div>
                <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-slate-bg font-extrabold text-xs uppercase tracking-wider rounded-full py-3.5 shadow-lg mt-2">Sign Up & Continue</button>
            </form>
        </div>
    </div>

    <!-- Delivery & Payment Form Modal -->
    <div id="checkout-form-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-lg z-[250] flex justify-center items-center no-print">
        <div class="discover-card p-8 rounded-2xl w-11/12 max-w-md relative shadow-2xl">
            <button id="close-checkout-form" class="absolute top-4 right-4 text-2xl text-body hover:text-white">&times;</button>
            <span class="text-xs font-mono text-brand uppercase tracking-widest block mb-1 text-center">STEP 2 OF 2</span>
            <h2 class="text-2xl text-heading font-extrabold mb-6 text-center">Checkout Info</h2>

            <form id="delivery-payment-form" class="space-y-4">
                <div id="checkout-summary" class="text-xs border-b border-white/10 pb-3 space-y-1 max-h-32 overflow-y-auto"></div>
                <div>
                    <label class="block text-xs font-semibold text-heading mb-2">Delivery Location in Mabini</label>
                    <textarea id="delivery_location" rows="3" class="w-full bg-slate-bg border border-white/20 text-heading text-sm rounded-lg p-2.5 focus:outline-none focus:border-brand" placeholder="Resort Name, Barangay, Mabini, Batangas" required></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-heading mb-2">Mode of Payment</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label><input type="radio" name="payment_mode" value="Cash on Delivery (COD)" class="sr-only" required><span class="pay-tile">💵 Cash on Delivery</span></label>
                        <label><input type="radio" name="payment_mode" value="GCash" class="sr-only"><span class="pay-tile">📱 GCash</span></label>
                        <label><input type="radio" name="payment_mode" value="Maya" class="sr-only"><span class="pay-tile">💳 Maya</span></label>
                        <label><input type="radio" name="payment_mode" value="Bank Transfer" class="sr-only"><span class="pay-tile">🏦 Bank Transfer</span></label>
                    </div>
                    <div id="payment-extra" class="hidden mt-3 text-xs bg-slate-bg border border-white/10 rounded-lg p-3">
                        <p id="payment-note" class="text-body"></p>
                        <div id="payment-ref-wrap" class="hidden mt-3">
                            <label class="block text-[10px] font-mono uppercase tracking-widest text-body mb-1">Reference Number</label>
                            <input type="text" id="payment_reference" maxlength="60" class="w-full bg-slate-bg border border-white/20 rounded-lg p-2.5 text-heading text-sm focus:outline-none focus:border-brand" placeholder="From your payment receipt" />
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full bg-brand hover:bg-brand-dark text-slate-bg font-extrabold text-xs uppercase tracking-wider rounded-full py-3.5 shadow-lg">Confirm Order</button>
            </form>
        </div>
    </div>

    <!-- Printable Receipt Modal -->
    <div id="receipt-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-xl z-[300] flex justify-center items-center">
        <div id="receipt-content" class="bg-white text-slate-900 p-8 rounded-2xl w-11/12 max-w-md shadow-2xl relative">
            <div class="text-center mb-6 border-b border-slate-200 pb-4">
                <span class="text-[10px] font-mono tracking-widest text-slate-400 block mb-1">ANILAO AZURE E-SHOP</span>
                <h2 class="text-3xl font-extrabold text-slate-900">Official Receipt</h2>
            </div>

            <div id="receipt-details" class="text-xs font-mono mb-6 space-y-2 text-slate-700"></div>

            <div class="border-t border-dashed border-slate-300 pt-4 mb-6">
                <div id="receipt-items" class="space-y-2 mb-4 text-sm text-slate-700"></div>
                <div class="flex justify-between font-extrabold text-base text-slate-900 border-t pt-3">
                    <span>TOTAL AMOUNT:</span>
                    <span id="receipt-total">₱0</span>
                </div>
            </div>

            <div class="flex gap-4 no-print">
                <button onclick="window.print()" class="flex-1 bg-slate-900 hover:bg-black text-white font-bold rounded-lg text-xs uppercase tracking-wider py-3">Print Receipt</button>
                <button id="close-receipt" class="flex-1 border border-slate-300 text-slate-700 hover:bg-slate-100 font-bold rounded-lg text-xs uppercase tracking-wider py-3">Close</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let isSignedUp = false;
        let pendingProduct = null;
        let currentUser = "";
        let customerId = null;   // comes from the database after sign up

        const renderProduct = (product) => `
            <div class="discover-card p-4 text-center hover:scale-105 transition-transform duration-300">
                <img src="${product.img}" class="w-full h-32 object-cover rounded-lg mb-3">
                <h3 class="text-heading font-semibold text-xs truncate">${product.name}</h3>
                <p class="text-brand font-bold text-sm my-2">₱${product.price.toLocaleString()}</p>
                <button class="w-full bg-brand hover:bg-brand-dark text-slate-bg font-extrabold rounded-full px-3 py-1.5 text-[11px] uppercase tracking-wider" onclick="handleAddToCart('${product.name}', ${product.price}, this)">Add to Cart</button>
            </div>
        `;

        // Load products from MySQL through api/products.php
        // Used when there is no PHP/MySQL (for example on Vercel)
        const FALLBACK_PRODUCTS = [
            { name: "Scuba Mask", price: 2500, category: "diving", img: "images/shop5.jpg" },
            { name: "Heel Fins", price: 3200, category: "diving", img: "images/shop6.jpg" },
            { name: "3mm Wetsuit", price: 4500, category: "diving", img: "images/shop7.jpg" },
            { name: "Regulator", price: 18000, category: "diving", img: "images/shop8.jpg" },
            { name: "BC Device", price: 22000, category: "diving", img: "images/shop9.jpg" },
            { name: "Dive Watch", price: 15500, category: "diving", img: "images/shop10.jpg" },
            { name: "Barako Coffee", price: 350, category: "local", img: "images/shop11.jpg" },
            { name: "Bagoong", price: 180, category: "local", img: "images/shop111.jpg" },
            { name: "Tablea Cacao", price: 220, category: "local", img: "images/shop12.jpg" },
            { name: "Woven Hat", price: 450, category: "local", img: "images/shop13.jpg" },
            { name: "Dried Tuyo", price: 150, category: "local", img: "images/shop14.jpg" },
            { name: "Panutsa", price: 120, category: "local", img: "images/shop15.jpg" }
        ];
        let offlineMode = false;
        let backend = 'php';          // 'php' (XAMPP) | 'supabase' (live site) | 'demo'
        let customerInfo = null;      // used by the Supabase order

        // ---- Supabase settings (paste your own values; see supabase.sql) ----
        const SUPABASE_URL = 'https://taqexrbhtjktsqhppjmn.supabase.co';      // example: https://abcdxyz.supabase.co
        const SUPABASE_KEY = 'sb_publishable_dJy9HVb7v4PE7Mwm5qpFbQ_eXNKKGJ8';      // the "anon" / "publishable" key. NEVER paste the secret key here.
        const onLiveSite = !['localhost', '127.0.0.1'].includes(location.hostname);

        async function loadProducts() {
            let products;
            try {
                let res;
                if (SUPABASE_URL && onLiveSite) {
                    res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,price,category,img:image_url&order=id`,
                        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
                    backend = 'supabase';
                } else {
                    res = await fetch('api/products.php');   // XAMPP / MySQL
                    backend = 'php';
                }
                if (!res.ok) throw new Error('Database not available');
                products = await res.json();
                if (!Array.isArray(products)) throw new Error('Bad data');
                products = products.map(p => ({ ...p, price: Number(p.price) }));
            } catch (err) {
                backend = 'demo';
                offlineMode = true;       // no database: use the built-in list
                products = FALLBACK_PRODUCTS;
                document.getElementById('local-goods').insertAdjacentHTML('afterend',
                    '<p class="text-[11px] text-body font-mono mt-6">Demo mode: orders are not saved to a database.</p>');
            }
            document.getElementById('diving-products').innerHTML = products.filter(p => p.category === 'diving').map(renderProduct).join('');
            document.getElementById('local-goods').innerHTML = products.filter(p => p.category === 'local').map(renderProduct).join('');
        }
        loadProducts();

        function handleAddToCart(name, price, btn) {
            if (!isSignedUp) {
                pendingProduct = { name, price, btn };
                document.getElementById('signup-modal').classList.remove('hidden');
            } else {
                addToCart(name, price, btn);
            }
        }

        function addToCart(name, price, btn) {
            const found = cart.find(i => i.name === name);
            if (found) { found.qty = Math.min(99, found.qty + 1); }
            else { cart.push({ name, price, qty: 1 }); }
            updateCart();
            flyToCart(btn);   // animation replaces the old alert popup
        }

        // The product picture flies into the Cart button
        function flyToCart(btn) {
            const cartIcon = document.getElementById('cart-btn');
            const card = btn ? btn.closest('.discover-card') : null;
            const img = card ? card.querySelector('img') : null;
            if (!cartIcon || !img) return;

            const from = img.getBoundingClientRect();
            const to = cartIcon.getBoundingClientRect();

            const flyer = img.cloneNode();
            flyer.className = 'fly-img';
            flyer.style.left = from.left + 'px';
            flyer.style.top = from.top + 'px';
            flyer.style.width = from.width + 'px';
            flyer.style.height = from.height + 'px';
            document.body.appendChild(flyer);

            requestAnimationFrame(() => {
                const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
                const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
                flyer.style.transform = `translate(${dx}px, ${dy}px) scale(0.1)`;
                flyer.style.opacity = '0.4';
            });

            flyer.addEventListener('transitionend', () => {
                flyer.remove();
                cartIcon.classList.remove('cart-bump');
                void cartIcon.offsetWidth;
                cartIcon.classList.add('cart-bump');   // little bounce when it lands
            }, { once: true });
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.reduce((n, i) => n + i.qty, 0);
            document.getElementById('cart-items').innerHTML = cart.length === 0
                ? '<p class="text-xs text-body text-center py-6">Your cart is empty.</p>'
                : cart.map((item, i) => `
                <div class="flex items-center gap-2 mb-3 text-xs">
                    <div class="flex-1 min-w-0">
                        <p class="text-heading font-medium truncate">${item.name}</p>
                        <p class="text-body">₱${item.price.toLocaleString()} each</p>
                    </div>
                    <button onclick="changeQty(${i}, -1)" class="qty-btn" aria-label="Decrease">−</button>
                    <input type="number" min="1" max="99" value="${item.qty}" onchange="setQty(${i}, this.value)" class="qty-input">
                    <button onclick="changeQty(${i}, 1)" class="qty-btn" aria-label="Increase">+</button>
                    <span class="w-20 text-right text-brand font-bold">₱${(item.price * item.qty).toLocaleString()}</span>
                    <button onclick="removeItem(${i})" class="text-body hover:text-red-400 text-xl leading-none" aria-label="Remove item">&times;</button>
                </div>`).join('');
            document.getElementById('total-price').innerText = cart.reduce((sum, item) => sum + item.price * item.qty, 0).toLocaleString();
        }

        function changeQty(i, d) { setQty(i, cart[i].qty + d); }
        function setQty(i, value) {
            const q = Math.max(1, Math.min(99, parseInt(value) || 1));
            cart[i].qty = q;
            updateCart();
        }
        function removeItem(i) { cart.splice(i, 1); updateCart(); }

        // ---- Payment options: edit these numbers to your real accounts ----
        const PAYMENT_INFO = {
            'Cash on Delivery (COD)': { ref: false, note: 'Pay in cash when your order arrives or when you pick it up at the resort.' },
            'GCash': { ref: true, note: 'Send the total to GCash 0917 000 0000 (Anilao Azure), then enter the reference number.' },
            'Maya': { ref: true, note: 'Send the total to Maya 0918 000 0000 (Anilao Azure), then enter the reference number.' },
            'Bank Transfer': { ref: true, note: 'Transfer to BDO account 0000 0000 0000 (Anilao Azure), then enter the reference number.' }
        };
        function showPaymentExtra() {
            const sel = document.querySelector('input[name="payment_mode"]:checked');
            const box = document.getElementById('payment-extra');
            const input = document.getElementById('payment_reference');
            if (!sel) { box.classList.add('hidden'); input.required = false; return; }
            const info = PAYMENT_INFO[sel.value];
            document.getElementById('payment-note').innerText = info.note;
            document.getElementById('payment-ref-wrap').classList.toggle('hidden', !info.ref);
            input.required = info.ref;
            box.classList.remove('hidden');
        }
        document.querySelectorAll('input[name="payment_mode"]').forEach(r => r.addEventListener('change', showPaymentExtra));

        function renderCheckoutSummary() {
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            document.getElementById('checkout-summary').innerHTML =
                cart.map(i => `<div class="flex justify-between text-body"><span>${i.qty}x ${i.name}</span><span>₱${(i.price * i.qty).toLocaleString()}</span></div>`).join('') +
                `<div class="flex justify-between font-bold text-heading pt-1"><span>Total</span><span>₱${total.toLocaleString()}</span></div>`;
        }

        const toggleClass = (id, cls) => document.getElementById(id).classList.toggle(cls);

        document.getElementById('cart-btn').onclick = () => toggleClass('cart-modal', 'hidden');
        document.getElementById('close-cart').onclick = () => toggleClass('cart-modal', 'hidden');
        document.getElementById('close-signup').onclick = () => toggleClass('signup-modal', 'hidden');
        document.getElementById('close-checkout-form').onclick = () => toggleClass('checkout-form-modal', 'hidden');

        document.getElementById('close-receipt').onclick = () => {
            toggleClass('receipt-modal', 'hidden');
            cart = []; updateCart();
        };

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const first = document.getElementById('floating_first_name').value;
            const last = document.getElementById('floating_last_name').value;
            const email = document.getElementById('floating_email').value;

            if (backend !== 'php') { customerInfo = { email: email, first: first, last: last }; } else
            // Save the customer in MySQL through api/signup.php
            try {
                const res = await fetch('api/signup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, first_name: first, last_name: last })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                customerId = data.customer_id;
            } catch (err) {
                alert('Sign up failed: ' + err.message);
                return;
            }

            isSignedUp = true;
            currentUser = first + ' ' + last;
            toggleClass('signup-modal', 'hidden');
            if (pendingProduct) {
                addToCart(pendingProduct.name, pendingProduct.price, pendingProduct.btn);
                pendingProduct = null;
            }
        });

        document.getElementById('checkout-btn').onclick = () => {
            if(cart.length === 0) return alert("Cart is empty!");
            toggleClass('cart-modal', 'hidden');
            renderCheckoutSummary();
            toggleClass('checkout-form-modal', 'hidden');
        };

        document.getElementById('delivery-payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            let loc = document.getElementById('delivery_location').value;
            const pay = document.querySelector('input[name="payment_mode"]:checked').value;
            const payRef = document.getElementById('payment_reference').value.trim();
            let total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            let date = new Date().toLocaleString();
            let refNum;

            if (backend === 'demo') {
                refNum = Math.floor(Math.random() * 900000) + 100000;
            } else if (backend === 'supabase') {
                try {
                    // Supabase function place_order saves the order and checks prices on the server
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/place_order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
                        body: JSON.stringify({
                            p_email: customerInfo.email,
                            p_first: customerInfo.first,
                            p_last: customerInfo.last,
                            p_location: loc,
                            p_payment: pay,
                            p_reference: payRef,
                            p_items: cart.map(i => ({ name: i.name, qty: i.qty }))
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || 'Order failed');
                    refNum = data.ref;
                    total = data.total;
                } catch (err) {
                    alert('Could not save your order: ' + err.message);
                    return;
                }
            } else try {
                // Save the order in MySQL through api/checkout.php
                const res = await fetch('api/checkout.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: customerId,
                        delivery_location: loc,
                        payment_mode: pay,
                        payment_reference: payRef,
                        items: cart.map(i => ({ name: i.name, qty: i.qty }))
                    })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error);
                refNum = data.ref;
                total = data.total;
            } catch (err) {
                alert('Could not save your order: ' + err.message);
                return;
            }

            document.getElementById('receipt-details').innerHTML = `
                <p><strong>ORDER REF:</strong> #AZURE-${refNum}</p>
                <p><strong>DATE:</strong> ${date}</p>
                <p><strong>CUSTOMER:</strong> ${currentUser}</p>
                <p><strong>DELIVERY LOCATION:</strong> ${loc}</p>
                <p><strong>PAYMENT METHOD:</strong> ${pay}</p>
                ${payRef ? `<p><strong>PAYMENT REF:</strong> ${payRef}</p>` : ''}
            `;

            document.getElementById('receipt-items').innerHTML = cart.map(item => `<div class="flex justify-between"><span>${item.qty}x ${item.name}</span><span>₱${(item.price * item.qty).toLocaleString()}</span></div>`).join('');
            document.getElementById('receipt-total').innerText = `₱${total.toLocaleString()}`;

            e.target.reset();
            showPaymentExtra();
            toggleClass('checkout-form-modal', 'hidden');
            toggleClass('receipt-modal', 'hidden');
        });
    </script>
</body>
</html>
